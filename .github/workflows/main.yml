name: Keep Infrastructure Automation Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  trigger-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Infrastructure Automation Engine
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "❌ ERROR: Missing DASHBOARD_URL or CRON_SECRET."
            exit 1
          fi

          echo "Triggering Infrastructure Automation Engine at $DASHBOARD_URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DASHBOARD_URL/api/infrastructure/automation/trigger" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Trigger successful (HTTP 200)."
          else
            echo "⚠️ Trigger failed with HTTP $HTTP_STATUS."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep GitHub Actions Alive
        run: |
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DAYS_SINCE_COMMIT=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))
          
          if [ "$DAYS_SINCE_COMMIT" -gt 50 ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m "chore: keep github actions alive"
            git push
          else
            echo "Last commit was $DAYS_SINCE_COMMIT days ago. No keepalive commit needed."
          fi
